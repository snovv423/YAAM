# Nginx reverse-proxy конфигурация YAAM hqtest (HQ_LINK_BASE_PATH="" clean-root,
# см. server/services/hq/basePath.js и YAAM-HQ-Stage-2.1-Clean-Root-Routing-
# Report.md).
#
# Stage 36 — этот файл СИНХРОНИЗИРОВАН с реально применённым
# /etc/nginx/sites-available/hqtest.yaam.su на VPS (проверено `nginx -T`
# после `nginx -t` + `systemctl reload nginx`, живые curl-проверки /media/,
# /hq, /health/ready, /d/ прошли). До этой стадии файл в репозитории отставал
# от сервера (не хватало блока /d/, добавленного на Stage 19.1 напрямую на
# VPS) — синхронизация приведена в соответствие с фактическим состоянием, а
# не переписана заново. Секреты/пути к сертификатам ниже — реальные пути на
# VPS (Let's Encrypt), не placeholder.
#
# НЕ затрагивает конфигурацию api-pg.yaam.su — отдельный upstream (порт
# 3002, не 3001), отдельный server_name, отдельный файл в sites-available/.
# `sudo nginx -t` ПЕРЕД `systemctl reload nginx` — синтаксическая ошибка в
# этом файле не должна суметь уронить уже работающий api-pg.yaam.su.
#
# КРИТИЧНО про конечный слэш в proxy_pass ("/hq/") — см. server/test/
# postgresql/helpers/hqReverseProxy.js и hqCleanRootStage21.test.js: nginx
# заменяет совпавшую часть location ("/", один символ) на URI из proxy_pass
# и ДОБАВЛЯЕТ остаток исходного пути. Без конечного слэша результат для
# "/login" был бы "/hq"+"login" = "/hqlogin" (сломанный путь). Это поведение
# уже проверено тестовым Node-харнессом, воспроизводящим документированную
# семантику nginx, — не менять без повторной проверки.

upstream yaam_hqtest_backend {
    server 127.0.0.1:3002;   # отдельный порт — НЕ 3001 (тот занят api-pg.yaam.su)
    keepalive 8;
}

server {
    listen 80;
    listen [::]:80;
    server_name hqtest.yaam.su;

    # Let's Encrypt HTTP-01 challenge (certbot --webroot) — держим ДО
    # редиректа на HTTPS, иначе продление сертификата будет ломаться.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name hqtest.yaam.su;

    ssl_certificate     /etc/letsencrypt/live/hqtest.yaam.su/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/hqtest.yaam.su/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    add_header Strict-Transport-Security "max-age=300" always;
    add_header X-Permitted-Cross-Domain-Policies "none" always;

    # Дефолт для большинства маршрутов (логин/текстовые HQ-формы, /d/,
    # /health/*) — щедрый, но не безлимитный лимит. Stage 36 — HQ теперь
    # ПРИНИМАЕТ файлы (загрузка фото ресторана/блюда, см.
    # server/routes/hq/restaurants.js: multer + services/hq/media/
    # imagePipeline.js MAX_SOURCE_BYTES=15МБ) — но только через POST-формы,
    # которые все проходят через location / ниже, поэтому именно там задан
    # отдельный, больший лимит (с запасом на multipart-overhead), а не здесь
    # для всего server-блока — /d/ и /health/* по-прежнему защищены узким
    # 64k, им большие тела не нужны никогда.
    client_max_body_size 64k;

    proxy_connect_timeout 5s;
    proxy_send_timeout 15s;
    proxy_read_timeout 15s;

    # Явно закрывает попытку зайти на внутренний "/hq/..." снаружи — та же
    # honest-граница, что уже спроектирована для hq.yaam.su (Stage 2.1
    # отчёт, раздел 9). НЕ строго обязателен для корректности (приложение
    # само с HQ_LINK_BASE_PATH="" не открывает вторую рабочую копию панели
    # под "/hq" — см. тест B7), но делает границу явной прямо в конфиге.
    # --- Capability-ссылки на расчётные документы (Stage 19.1, пункт 3) ---
    # Токен находится В ПУТИ URL. Общий access_log пишет $request целиком,
    # поэтому без этого блока секрет оседает в /var/log/nginx/access.log в
    # открытом виде — это и было найдено на hqtest 03.08.2026.
    # "^~" фиксирует префикс с приоритетом выше любого regex-location.
    location ^~ /d/ {
        access_log off;
        add_header Cache-Control "no-store, private" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
        # Без завершающего слэша: путь /d/<token> должен уйти в приложение
        # как есть, а не быть переписан в корень HQ.
        proxy_pass http://yaam_hqtest_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Stage 39 — YooKassa Sandbox webhook (server/routes/postgresql/api.js:
    # router.post('/webhooks/payment', ...), смонтирован в КОРНЕ, без
    # префикса /hq). Точный "=" location имеет наивысший приоритет в nginx
    # (выше даже "^~"), поэтому этот путь никогда не попадёт под общий
    # location / (который переписывает всё в "/hq/..." — см. header-
    # комментарий файла). proxy_pass БЕЗ завершающего слэша и БЕЗ добавления
    # пути — сохраняет "/api/webhooks/payment" как есть, ровно как /d/ выше.
    # Временная мера для Stage 39 (провайдер на hqtest в остальное время —
    # PAYMENT_PROVIDER=mock, эта location безвредна и в mock-режиме: сам
    # webhook route на бэкенде монтируется только при PAYMENT_PROVIDER=
    # yookassa, см. routes/postgresql/api.js).
    location = /api/webhooks/payment {
        proxy_pass http://yaam_hqtest_backend/api/webhooks/payment;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Stage 36 — публичные фотографии (server/services/hq/media/provider.js:
    # LocalMediaProvider, persistent-режим, MEDIA_LOCAL_ROOT=/opt/yaam-hqtest/
    # media). alias отдаёт РОВНО .../media/public/ — private/masters/ этому
    # (и вообще ни одному) location здесь не сопоставлен, плюс файловые права
    # на private/ дополнительно 0700 (yaam:yaam, www-data туда не имеет
    # доступа даже на уровне ФС) — двойная граница, не только конфиг nginx.
    # "^~" — тот же приём, что уже применён к /d/ выше: приоритет над любым
    # regex-location, не зависит от порядка объявления.
    location ^~ /media/ {
        alias /opt/yaam-hqtest/media/public/;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Robots-Tag "noindex" always;
        try_files $uri =404;
    }

    location = /hq {
        return 404;
    }

    # Внутренний HQ mount доступен для диагностических/совместимых ссылок:
    # URI сохраняется без переписывания в /hq/hq/.... Точный /hq по-прежнему
    # закрыт location выше.
    location ^~ /hq/ {
        proxy_pass http://yaam_hqtest_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # HQ photo upload: 40 МиБ (services/hq/media/limits.js
        # MAX_SOURCE_BYTES) + запас на multipart-overhead. Значение обязано
        # быть БОЛЬШЕ прикладного лимита: иначе nginx обрывает запрос своим
        # 413 раньше приложения, и владелец видит голую страницу ошибки
        # вместо понятного текста про 40 МБ. Только этот location — остальные
        # остаются на дефолтных 64k.
        client_max_body_size 45m;
    }

    # Публичный API должен сохранять исходный /api/... URI и не попадать в
    # clean-root HQ rewrite общего location /. Точный webhook-location выше
    # остаётся приоритетнее этого prefix-location.
    location ^~ /api/ {
        proxy_pass http://yaam_hqtest_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        # КРИТИЧНО: конечный слэш "/hq/" — см. header-комментарий файла.
        proxy_pass http://yaam_hqtest_backend/hq/;
        proxy_http_version 1.1;
        proxy_set_header Connection "";

        # HQ photo upload: 40 МиБ (services/hq/media/limits.js
        # MAX_SOURCE_BYTES) + запас на multipart-overhead. Значение обязано
        # быть БОЛЬШЕ прикладного лимита: иначе nginx обрывает запрос своим
        # 413 раньше приложения, и владелец видит голую страницу ошибки
        # вместо понятного текста про 40 МБ. Только этот location — остальные
        # остаются на дефолтных 64k.
        client_max_body_size 45m;

        # Trust Proxy контракт (TRUST_PROXY=loopback в .env.hqtest.example) —
        # три заголовка ниже обязательны для корректной работы req.ip/
        # req.protocol/Secure-cookie в Express.
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Health-эндпоинты — тот же upstream, отдельная location для чистого
    # access_log (не шумит проверками мониторинга в общем логе).
    location = /health/live {
        proxy_pass http://yaam_hqtest_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        access_log off;
    }
    location = /health/ready {
        proxy_pass http://yaam_hqtest_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        access_log off;
    }
}
