# Nginx reverse-proxy шаблон для YAAM hqtest (HQ_LINK_BASE_PATH="" clean-root,
# см. server/services/hq/basePath.js и YAAM-HQ-Stage-2.1-Clean-Root-Routing-
# Report.md).
#
# ЭТО ШАБЛОН, НЕ ПРИМЕНЁННЫЙ НИ К ОДНОМУ РЕАЛЬНОМУ Nginx/VPS — подготовлен
# без доступа к реальной инфраструктуре. Замените ${DOMAIN} (hqtest.yaam.su)
# и пути к сертификатам на реальные перед использованием.
#
# НЕ затрагивает конфигурацию api-pg.yaam.su — отдельный upstream (порт
# 3002, не 3001), отдельный server_name, отдельный файл в sites-available/.
# `sudo nginx -t` ПЕРЕД `systemctl reload nginx` — синтаксическая ошибка в
# этом файле не должна суметь уронить уже работающий api-pg.yaam.su.
#
# КРИТИЧНО про конечный слэш в proxy_pass ("/hq/") — см. server/test/
# postgresql/helpers/hqReverseProxy.js и hqCleanRootStage21.test.js: nginx
# заменяет совпавшую часть location ("/", один символ) на URI из proxy_pass
# и ДОБАВЛЯЕТ остаток исходного пути. Без конечного слэша результат для
# "/login" был бы "/hq"+"login" = "/hqlogin" (сломанный путь). Это поведение
# уже проверено тестовым Node-харнессом, воспроизводящим документированную
# семантику nginx, — не менять без повторной проверки.

upstream yaam_hqtest_backend {
    server 127.0.0.1:3002;   # отдельный порт — НЕ 3001 (тот занят api-pg.yaam.su)
    keepalive 8;
}

server {
    listen 80;
    listen [::]:80;
    server_name hqtest.yaam.su;

    # Let's Encrypt HTTP-01 challenge (certbot --webroot) — держим ДО
    # редиректа на HTTPS, иначе продление сертификата будет ломаться.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name hqtest.yaam.su;

    ssl_certificate     /etc/letsencrypt/live/hqtest.yaam.su/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/hqtest.yaam.su/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    add_header Strict-Transport-Security "max-age=300" always;
    add_header X-Permitted-Cross-Domain-Policies "none" always;

    # HQ не принимает файлы (только форма логина/текстовые формы) — щедрый,
    # но не безлимитный лимит.
    client_max_body_size 64k;

    proxy_connect_timeout 5s;
    proxy_send_timeout 15s;
    proxy_read_timeout 15s;

    # Явно закрывает попытку зайти на внутренний "/hq/..." снаружи — та же
    # honest-граница, что уже спроектирована для hq.yaam.su (Stage 2.1
    # отчёт, раздел 9). НЕ строго обязателен для корректности (приложение
    # само с HQ_LINK_BASE_PATH="" не открывает вторую рабочую копию панели
    # под "/hq" — см. тест B7), но делает границу явной прямо в конфиге.
    location /hq {
        return 404;
    }

    location / {
        # КРИТИЧНО: конечный слэш "/hq/" — см. header-комментарий файла.
        proxy_pass http://yaam_hqtest_backend/hq/;
        proxy_http_version 1.1;
        proxy_set_header Connection "";

        # Trust Proxy контракт (TRUST_PROXY=loopback в .env.hqtest.example) —
        # три заголовка ниже обязательны для корректной работы req.ip/
        # req.protocol/Secure-cookie в Express.
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Health-эндпоинты — тот же upstream, отдельная location для чистого
    # access_log (не шумит проверками мониторинга в общем логе).
    location = /health/live {
        proxy_pass http://yaam_hqtest_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        access_log off;
    }
    location = /health/ready {
        proxy_pass http://yaam_hqtest_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        access_log off;
    }
}
